    <!-- Your app -->

    <script type="module" src="/src/assets/scripts/vanta.globe.min.js"></script>

    <script type="module">
      VANTA.GLOBE({
        el: "body",
        mouseControls: false,

        gyroControls: false,
        minHeight: 200.0,

        color: 0x4c6944,
        color2: 0x368fb6,
